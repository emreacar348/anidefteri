<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Aşkın Kriptosu</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4a0e60; 
            --accent: #a37eba;
        }

        body {
            font-family: 'Lato', sans-serif;
            overflow: hidden;
        }

        #background-video {
            position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: -2;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
        }
        
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 12, 41, 0.6);
            z-index: -1;
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 12, 41, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.8s ease-out;
        }
        .splash-button {
            border: 1px solid var(--accent);
            padding: 0.75rem 2rem;
            margin: 0 1rem;
            border-radius: 5px;
            background-color: transparent;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s;
        }
        .splash-button:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem; border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%; max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
        }

        .login-container h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 5px rgba(255, 255, 255, 0.7);
        }

        .title-char {
            opacity: 0;
            transform: translateY(20px);
            display: inline-block;
            animation: fadeInChar 0.5s forwards;
        }
        @keyframes fadeInChar {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cipher-box { background-color: rgba(0,0,0,0.2); border: 1px dashed rgba(255,255,255,0.4); padding: 1.5rem; border-radius: 0.5rem; text-align: center; margin-bottom: 1.5rem; }
        .cipher-text { font-family: 'Courier New', Courier, monospace; font-size: 1.75rem; letter-spacing: 0.2em; color: white; font-weight: bold; }
        .key-clue { color: #e2e8f0; font-family: 'Lato', sans-serif; font-style: italic; font-weight: 300; margin-top: 0.75rem;}
        .form-input { background-color: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); color: white; padding: 0.75rem 1rem; border-radius: 0.5rem; width: 100%; font-size: 0.75rem;}
        .form-input::placeholder { color: #cbd5e1; }
        .form-button { background-color: var(--accent); color: var(--primary); padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; width: 100%; transition: all 0.3s;}
        .form-button:hover { background-color: white; color: var(--primary); }
        label { color: #e2e8f0; font-family: 'Lato', sans-serif; }
        .error-message { color: #fecaca; background-color: rgba(185, 28, 28, 0.5); padding: 0.5rem; border-radius: 0.5rem; }
        @keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); } }
        .shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }


        #sound-control-button {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }
        #sound-control-button.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        #sound-control-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <video id="background-video" src="videos/bitanem.mp4" loop muted playsinline></video>
    <div class="video-overlay"></div>

    <div id="splash-screen">
        <h2 class="text-3xl mb-4" style="font-family: 'Cormorant Garamond', serif;">Bu deneyime hazır mısın?</h2>
        <p class="mb-8 text-gray-300">En iyi deneyim için sesi açmanı öneririm.</p>
        <div>
            <button id="play-with-sound" class="splash-button">Sesli Devam Et</button>
            <button id="play-muted" class="splash-button">Sessiz Devam Et</button>
        </div>
    </div>

    <div id="sound-control-button" aria-label="Sesi aç/kapat">
        <svg id="icon-muted" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
        <svg id="icon-unmuted" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
    </div>

    <div class="login-wrapper">
        <div id="loginContainer" class="login-container">
            <h1 id="main-title" class="text-center text-5xl font-bold mb-4">Aşkın Kriptosu</h1>
            <div class="cipher-box">
                <p class="cipher-text">ZİERCNN</p>
                <p class="key-clue">Anahtar:HER ŞEYİN BAŞLADIĞI TARİH RAKAMLARI TOPLAMI</p>
            </div>
            <form id="puzzleForm" class="space-y-6">
                <div>
                    <label for="puzzleAnswer" class="block text-sm font-medium mb-2">❤️ Çözülmüş Parola:</label>
                    <input type="text" id="puzzleAnswer" name="puzzleAnswer" class="form-input" placeholder="Şifreyi küçük harflerle buraya çöz bitanem..." required>
                </div>
                <p id="puzzleError" class="error-message hidden" role="alert"></p>
                <button type="submit" class="form-button">Sisteme Eriş</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('background-video');
            const splashScreen = document.getElementById('splash-screen');
            const playWithSoundBtn = document.getElementById('play-with-sound');
            const playMutedBtn = document.getElementById('play-muted');
            const mainTitle = document.getElementById('main-title');
            const soundControlBtn = document.getElementById('sound-control-button');
            const iconMuted = soundControlBtn.querySelector('#icon-muted');
            const iconUnmuted = soundControlBtn.querySelector('#icon-unmuted');

            const titleText = mainTitle.innerText;
            mainTitle.innerHTML = '';
            titleText.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.className = 'title-char';
                span.textContent = (char === ' ') ? '\u00A0' : char;
                span.style.animationDelay = `${index * 0.05}s`;
                mainTitle.appendChild(span);
            });

            function updateSoundIcon() {
                iconMuted.classList.toggle('hidden', !video.muted);
                iconUnmuted.classList.toggle('hidden', video.muted);
            }

            function startExperience(withSound) {
                if (withSound) {
                    video.muted = false;
                    updateSoundIcon();
                    setTimeout(() => {
                        video.muted = true;
                        updateSoundIcon();
                        soundControlBtn.classList.add('visible');
                    }, 3000);
                } else {
                    video.muted = true;
                    updateSoundIcon();
                    soundControlBtn.classList.add('visible');
                }
                video.play().catch(error => console.log("Video oynatma hatası:", error));
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                }, 800);
            }

            playWithSoundBtn.addEventListener('click', () => startExperience(true));
            playMutedBtn.addEventListener('click', () => startExperience(false));

            soundControlBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                updateSoundIcon();
            });

            const puzzleForm = document.getElementById('puzzleForm');
            const answerInput = document.getElementById('puzzleAnswer');
            const errorDisplay = document.getElementById('puzzleError');
            const loginContainer = document.getElementById('loginContainer');

            const CORRECT_ANSWER = "bitanem";

            puzzleForm.addEventListener('submit', (e) => {
                e.preventDefault();
                errorDisplay.classList.add('hidden');
                loginContainer.classList.remove('shake');
                const userAnswer = answerInput.value.trim().toLowerCase().replace(/\s/g, '');
                
                if (userAnswer === CORRECT_ANSWER) {
                    loginContainer.innerHTML = `<h1 class="text-center text-3xl font-bold text-green-600 animate-pulse">Erişim İzni Verildi!</h1><p class="text-center mt-4">Bizim Dünyamız'a hoş geldin...</p>`;
                    setTimeout(() => {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    errorDisplay.textContent = "Parola yanlış. İpucunu tekrar gözden geçir...";
                    errorDisplay.classList.remove('hidden');
                    loginContainer.classList.add('shake');
                    answerInput.select();
                }
            });
        });
    </script>
</body>
</html>
